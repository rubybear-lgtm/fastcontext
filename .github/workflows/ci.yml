name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Build wheel (verify it builds)
        run: uv build --wheel

      - name: Verify wheel contents
        run: |
          uv run --no-project python -c "
          import zipfile, sys
          from pathlib import Path
          wheels = list(Path('dist').glob('*.whl'))
          if not wheels:
              print('ERROR: no wheel found', file=sys.stderr)
              sys.exit(1)
          whl = wheels[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              for req in ['fastcontext_mcp/__init__.py', 'fastcontext_mcp/server.py', 'fastcontext_mcp/_shared.py', 'fastcontext_mcp/configwriter.py', 'fastcontext_mcp/release.py', 'fastcontext_mcp/lifecycle.py', 'fastcontext_mcp/worker.py', 'fastcontext_mcp/verify.py', 'fastcontext_mcp/sources.py', 'fastcontext_mcp/engine.py']:
                  assert req in names, f'Missing in wheel: {req}'
          print(f'Wheel OK: {whl.name}')
          "

      - name: Install test dependencies
        run: |
          # Install only the light deps needed by configwriter/release modules
          # (tomli_w) plus the MCP SDK, YAML validator, and pytest. The heavy MLX deps
          # require Apple Silicon and are not needed for the test suite.
          uv pip install --system pytest tomli-w 'mcp>=1.0.0,<2' pyyaml

      - name: Install source search dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest tests/ -v

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: benchmark
