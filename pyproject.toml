[project]
name = "fastcontext-mcp"
version = "0.1.0"
description = "MCP server wrapping Microsoft FastContext with in-process MLX inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "mlx-lm",
    "fastcontext @ git+https://github.com/microsoft/fastcontext.git",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
fastcontext-mcp = "fastcontext_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fastcontext_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
