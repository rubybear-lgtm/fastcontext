[project]
name = "fastcontext-mcp"
version = "0.1.0"
description = "MCP server wrapping Microsoft FastContext with in-process MLX inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "mlx-lm",
    "fastcontext @ git+https://github.com/microsoft/fastcontext.git",
]

[project.scripts]
fastcontext-mcp = "fastcontext_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/fastcontext_mcp"]
